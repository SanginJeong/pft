<svg xmlns="http://www.w3.org/2000/svg" width="920" height="300" viewBox="0 0 920 300" font-family="'SF Mono','Menlo','Consolas',monospace">
  <rect width="920" height="300" rx="20" fill="#f5f5f7"/>

  <defs>
    <marker id="carrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0071e3"/>
    </marker>
  </defs>

  <!-- ===== BEFORE: 한 줄 조건문 ===== -->
  <rect x="24" y="20" width="412" height="260" rx="14" fill="#1d1d1f"/>
  <text x="44" y="46" font-family="'Pretendard',sans-serif" font-size="13" fill="#8b949e">Before · 한 줄 조건문에 코드 추가</text>
  <text x="416" y="46" font-family="'Pretendard',sans-serif" font-size="13" font-weight="700" text-anchor="end"><tspan fill="#ff7b72">−1</tspan><tspan fill="#7ee787" dx="6">+4</tspan></text>

  <rect x="32" y="88" width="396" height="22" rx="5" fill="#f851491a" stroke="#f8514933"/>
  <rect x="32" y="112" width="396" height="94" rx="5" fill="#2ea0431a" stroke="#2ea04333"/>

  <g font-size="14">
    <text x="64" y="80" fill="#8b949e">const handleSubmit = () =&gt; {</text>
    <text x="44" y="104" fill="#ff7b72">−</text>
    <text x="80.8" y="104" fill="#ff7b72">if (isPending) return;</text>
    <text x="44" y="128" fill="#7ee787">+</text>
    <text x="80.8" y="128" fill="#e6edf3">if (isPending) {</text>
    <text x="44" y="152" fill="#7ee787">+</text>
    <text x="97.6" y="152" fill="#e6edf3">showToast("요청을 처리하고 있어요");</text>
    <text x="44" y="176" fill="#7ee787">+</text>
    <text x="97.6" y="176" fill="#e6edf3">return;</text>
    <text x="44" y="200" fill="#7ee787">+</text>
    <text x="80.8" y="200" fill="#e6edf3">}</text>
    <text x="80.8" y="224" fill="#8b949e">mutate(form);</text>
    <text x="64" y="248" fill="#8b949e">};</text>
  </g>

  <!-- arrow -->
  <line x1="442" y1="150" x2="476" y2="150" stroke="#0071e3" stroke-width="2.5" marker-end="url(#carrow)"/>

  <!-- ===== AFTER: 중괄호 조건문 ===== -->
  <rect x="484" y="20" width="412" height="260" rx="14" fill="#1d1d1f"/>
  <text x="504" y="46" font-family="'Pretendard',sans-serif" font-size="13" fill="#8b949e">After · 중괄호 조건문에 코드 추가</text>
  <text x="876" y="46" font-family="'Pretendard',sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#7ee787">+1</text>

  <rect x="492" y="112" width="396" height="22" rx="5" fill="#2ea0431a" stroke="#2ea04333"/>

  <g font-size="14">
    <text x="524" y="80" fill="#8b949e">const handleSubmit = () =&gt; {</text>
    <text x="540.8" y="104" fill="#8b949e">if (isPending) {</text>
    <text x="504" y="128" fill="#7ee787">+</text>
    <text x="557.6" y="128" fill="#e6edf3">showToast("요청을 처리하고 있어요");</text>
    <text x="557.6" y="152" fill="#8b949e">return;</text>
    <text x="540.8" y="176" fill="#8b949e">}</text>
    <text x="540.8" y="200" fill="#8b949e">mutate(form);</text>
    <text x="524" y="224" fill="#8b949e">};</text>
  </g>
</svg>
